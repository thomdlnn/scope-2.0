apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scope
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/REPO.git # à adapter : votre dépôt SCOPE
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: scope
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
