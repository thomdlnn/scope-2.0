apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scope
  labels:
    app.kubernetes.io/name: scope
  annotations:
    # Certains contrôleurs (Traefik avec providers.kubernetesIngress.ingressClass)
    # filtrent aussi sur cette annotation, en plus de spec.ingressClassName.
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: scope.local # paramétrable : voir le patch dans kustomization.yaml
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scope
                port:
                  name: http
