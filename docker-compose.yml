# SCOPE en local : le générateur lit vos dépôts via l'API GitHub (token dans .env)
# toutes les 15 min, nginx sert la page sur http://localhost:8080.
#   cp .env.example .env   # puis renseignez SCOPE_GH_TOKEN
#   ./scope.sh up          # ou : docker compose up -d --build
services:
  generator:
    build: .
    image: scope-generator:local
    env_file:
      - path: .env
        required: false
    volumes:
      - ./projects:/projects:ro
      - site:/site
    restart: unless-stopped

  web:
    image: nginxinc/nginx-unprivileged:1.28.0-alpine
    ports:
      - "127.0.0.1:${SCOPE_PORT:-8080}:8080"
    volumes:
      - site:/site:ro
      - ./deploy/k8s/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - generator
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
    restart: unless-stopped

volumes:
  site:
