# SCOPE en local : le générateur relit les rapports .scope/rapports/ des dépôts
# de SCOPE_ROOT (par défaut ~/Git, monté en lecture seule) toutes les 3 s, et
# nginx sert la page sur http://localhost:8080. Avec SCOPE_GH_TOKEN dans .env
# (optionnel, lecture seule), SCOPE ajoute l'état des dépôts GitHub.
#   ./scope.sh up        (ou : docker compose up -d --build)
services:
  generator:
    build: .
    image: scope-generator:local
    # Votre identifiant (exporté par scope.sh) : lecture des dépôts sous Linux.
    user: "${SCOPE_UID:-10001}:${SCOPE_GID:-10001}"
    env_file:
      - path: .env
        required: false
    environment:
      SCOPE_ROOT: /repos
      SCOPE_PROJECTS: /projects
    volumes:
      - ${SCOPE_ROOT:-${HOME}/Git}:/repos:ro
      - ./projects:/projects:ro
      - site:/site
    restart: unless-stopped

  web:
    image: nginxinc/nginx-unprivileged:1.28.0-alpine
    ports:
      - "127.0.0.1:${SCOPE_PORT:-8080}:8080"
    volumes:
      - site:/site:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - generator
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
    restart: unless-stopped

volumes:
  site:
