# Sert le site SCOPE écrit par le générateur dans /site/current (lien symbolique
# basculé d'un coup à chaque mise à jour).
server {
    listen 8080;
    server_name _;
    root /site/current;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' http: https:; frame-ancestors 'none'" always;

    # Le site change toutes les quelques secondes : toujours revalider.
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' http: https:; frame-ancestors 'none'" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Sonde de vie de nginx lui-même (indépendante du contenu).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
