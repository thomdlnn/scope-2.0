# Mode Kubernetes : génère le site SCOPE et le publie sur la branche scope-site
# (servie par nginx + git-sync).
name: build-site

on:
  schedule:
    - cron: "*/15 * * * *" # rafraîchissement automatique
  workflow_dispatch: # ./scope.sh refresh
  push:
    branches: [main] # branche par défaut du dépôt

permissions:
  contents: write # pousser la branche scope-site
  pull-requests: read # lire les PR du dépôt scope lui-même

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    # Mode Kubernetes seulement : activez-le avec la variable de dépôt SCOPE_MODE=actions
    # (Settings → Secrets and variables → Actions → Variables). En mode Docker Compose,
    # le générateur tourne en local et ce workflow ne sert pas.
    if: vars.SCOPE_MODE == 'actions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/requirements.txt

      - name: Dépendances
        run: pip install -r generator/requirements.txt

      - name: Générer le site
        env:
          # Token global (SCOPE_GH_TOKEN) ; à défaut, le token de l'Action, qui ne
          # lit que le dépôt scope lui-même.
          SCOPE_GH_TOKEN: ${{ secrets.SCOPE_GH_TOKEN || github.token }}
          # Tokens dédiés (SCOPE_TOKEN_<PROJET>) : le générateur y lit celui
          # déclaré par chaque projet (clé `token` de projects/<projet>.yml).
          SCOPE_SECRETS: ${{ toJSON(secrets) }}
          # Token intégré de l'Action : lit le dépôt scope lui-même (projects/scope.yml : token: GITHUB_TOKEN).
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: generator
        run: python -m scope_gen --projects projects --out site -v

      - name: Publier sur scope-site (un seul commit, force push)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init -q -b scope-site
          git config user.name "scope-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site: ${GITHUB_SHA::7} (${GITHUB_EVENT_NAME})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" scope-site
