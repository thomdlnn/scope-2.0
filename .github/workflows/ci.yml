# Tests du générateur, vérification navigateur, shellcheck et image Docker sur chaque PR.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/requirements-dev.txt
      - run: pip install -r generator/requirements-dev.txt
      - name: pytest
        working-directory: generator
        run: python -m pytest -q

  navigateur:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Vérification dans Chromium (Playwright, Docker)
        run: scripts/verifier-site.sh "$RUNNER_TEMP/captures"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck scope.sh scripts/*.sh
      - name: docker compose config
        run: docker compose config --quiet
      - name: image du générateur
        run: docker build -t scope-generator:ci .
